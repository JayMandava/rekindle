<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker>
<style>.t{font-size:30px;font-weight:700;fill:#14181f}.s{font-size:15px;fill:#4a5361}.h{font-size:17px;font-weight:700}
.bx{rx:14;stroke-width:2}.ln{stroke:#5b6472;stroke-width:2.4;fill:none;marker-end:url(#a)}.bi{marker-start:url(#a)}.lb{font-size:14px;fill:#5b6472;font-style:italic}</style></defs>
<rect width="1600" height="840" fill="#fff"/>
<text x="40" y="52" class="t">ReKindle architecture: Google Cloud end to end</text>
<text x="40" y="80" class="s">Deterministic SQL decides who and when. Gemini only writes. A deterministic verifier and the owner decide what is sent.</text>
<rect x="330" y="110" width="920" height="690" rx="20" fill="#f6f9ff" stroke="#9bb7ea" stroke-width="2" stroke-dasharray="8 6"/>
<text x="352" y="142" class="h" style="fill:#1f5fbf">Google Cloud project</text>
<rect class="bx" x="360" y="170" width="250" height="150" fill="#e7effb" stroke="#4285f4"/><text x="378" y="200" class="h" style="fill:#174ea6">BigQuery</text><text x="378" y="226" class="s">customers · orders · events</text><text x="378" y="248" class="s">RFM scoring + dormancy</text><text x="378" y="270" class="s">triggers in one SQL query</text>
<rect class="bx" x="360" y="350" width="250" height="150" fill="#e0f7fa" stroke="#12b5cb"/><text x="378" y="380" class="h" style="fill:#0b6e7e">Looker Studio</text><text x="378" y="406" class="s">recovered revenue</text><text x="378" y="428" class="s">auto-send &amp; reply rates</text><text x="378" y="450" class="s">reads a BigQuery view</text>
<rect class="bx" x="660" y="160" width="560" height="400" fill="#e6f4ea" stroke="#34a853"/>
<text x="680" y="192" class="h" style="fill:#137333">Cloud Run: ReKindle agent (FastAPI)</text>
<g font-size="16" font-weight="600" fill="#14181f">
<rect x="684" y="212" width="512" height="46" rx="10" fill="#fff" stroke="#34a853"/><text x="702" y="241">1  Segment: milestone · loyal &amp; dormant · at-risk · lapsed</text>
<rect x="684" y="274" width="512" height="46" rx="10" fill="#fff" stroke="#34a853"/><text x="702" y="303">2  Consent + suppression gate (before any generation)</text>
<rect x="684" y="336" width="512" height="46" rx="10" fill="#fff" stroke="#34a853"/><text x="702" y="365">3  Draft with cited facts (one regeneration on failure)</text>
<rect x="684" y="398" width="512" height="46" rx="10" fill="#fff" stroke="#ea4335"/><text x="702" y="427">4  Fact-verification guardrail (deterministic)</text>
<rect x="684" y="460" width="512" height="46" rx="10" fill="#fff" stroke="#34a853"/><text x="702" y="489">5  Risk tier + trust-earning router</text></g>
<text x="684" y="534" class="s" style="font-size:14px">Also: reply webhook (STOP in any language), order attribution, KPIs</text>
<rect class="bx" x="360" y="630" width="250" height="140" fill="#f3e8fd" stroke="#a142f4"/><text x="378" y="660" class="h" style="fill:#7627bb">Owner cockpit</text><text x="378" y="686" class="s">web UI served by Cloud Run</text><text x="378" y="708" class="s">approve · edit · reject</text><text x="378" y="730" class="s">each claim shown vs its fact</text>
<rect class="bx" x="660" y="630" width="270" height="140" fill="#fde8e6" stroke="#ea4335"/><text x="678" y="660" class="h" style="fill:#b3261e">Firestore</text><text x="678" y="686" class="s">draft queue · trust state</text><text x="678" y="708" class="s">suppression list</text><text x="678" y="730" class="s">real-time listeners</text>
<rect class="bx" x="960" y="630" width="260" height="140" fill="#fef3e0" stroke="#fbbc04"/><text x="978" y="660" class="h" style="fill:#b06000">Gemini on Vertex AI</text><text x="978" y="686" class="s">structured output: text +</text><text x="978" y="708" class="s">claims → fact ids</text><text x="978" y="730" class="s">reply-intent classification</text>
<rect class="bx" x="40" y="170" width="250" height="110" fill="#fff" stroke="#9aa4b2"/><text x="58" y="200" class="h" style="fill:#14181f">Baby Trails (existing)</text><text x="58" y="226" class="s">Airtable bookings → importer</text><text x="58" y="248" class="s">opt-in flag gates every draft</text>
<rect class="bx" x="40" y="400" width="250" height="110" fill="#fff" stroke="#9aa4b2"/><text x="58" y="430" class="h" style="fill:#14181f">Baby Trails webhook</text><text x="58" y="456" class="s">owns the WhatsApp webhook</text><text x="58" y="478" class="s">forwards STOP + replies</text>
<rect class="bx" x="1300" y="260" width="260" height="110" fill="#fff" stroke="#9aa4b2"/><text x="1318" y="290" class="h" style="fill:#14181f">WhatsApp Cloud API</text><text x="1318" y="316" class="s">approved Marketing template</text><text x="1318" y="338" class="s">(Meta-run delivery channel)</text>
<rect class="bx" x="1300" y="400" width="260" height="110" fill="#fff" stroke="#9aa4b2"/><text x="1318" y="430" class="h" style="fill:#14181f">Gmail API (optional)</text><text x="1318" y="456" class="s">no emails on file today;</text><text x="1318" y="478" class="s">opt-out added by the system</text>
<path class="ln" d="M290 225 H360"/>
<path class="ln" d="M610 245 H684"/><text x="622" y="236" class="lb">SQL</text>
<path class="ln" d="M660 300 H612"/><text x="618" y="292" class="lb">events</text>
<path class="ln" d="M485 320 V350"/><text x="496" y="340" class="lb">view</text>
<path class="ln" d="M290 455 H320 V540 H660"/><text x="330" y="530" class="lb">replies</text>
<path class="ln bi" d="M1090 560 V630"/><text x="1100" y="600" class="lb">draft ⇄ JSON</text>
<path class="ln" d="M795 560 V630"/><text x="805" y="600" class="lb">drafts</text>
<path class="ln bi" d="M660 700 H610"/><text x="618" y="690" class="lb">live</text>
<path class="ln" d="M1220 315 H1300"/><text x="1228" y="306" class="lb">send</text>
<path class="ln" d="M1220 455 H1300"/><text x="1228" y="446" class="lb">send</text>
</svg>