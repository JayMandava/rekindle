<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker>
<style>.t{font-size:30px;font-weight:700;fill:#14181f}.s{font-size:15px;fill:#4a5361}.bx{rx:12;stroke-width:2}
.ln{stroke:#5b6472;stroke-width:2.4;fill:none;marker-end:url(#a)}.lb{font-size:14px;fill:#5b6472;font-style:italic}</style></defs>
<rect width="1600" height="900" fill="#fff"/>
<text x="40" y="52" class="t">Process flow: from dormant customer to recovered revenue</text>
<text x="40" y="80" class="s">Human-supervised first, autonomy earned. Anything ungrounded is stopped; anything sensitive always goes to the owner.</text>
<rect class="bx" x="40" y="150" width="200" height="70" fill="#e7effb" stroke="#4285f4"/><text x="140.0" y="179.5" text-anchor="middle" style="fill:#14181f;font-size:16px;font-weight:700">Customer data</text><text x="140.0" y="200.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">BigQuery</text>
<rect class="bx" x="290" y="150" width="220" height="70" fill="#e7effb" stroke="#4285f4"/><text x="400.0" y="179.5" text-anchor="middle" style="fill:#14181f;font-size:16px;font-weight:700">Segment (RFM + triggers)</text><text x="400.0" y="200.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">milestone · loyal · at-risk</text>
<rect class="bx" x="560" y="150" width="220" height="70" fill="#fff" stroke="#ea4335"/><text x="670.0" y="179.5" text-anchor="middle" style="fill:#14181f;font-size:16px;font-weight:700">Consent + suppression</text><text x="670.0" y="200.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">gate</text>
<rect class="bx" x="830" y="150" width="230" height="70" fill="#fef3e0" stroke="#fbbc04"/><text x="945.0" y="179.5" text-anchor="middle" style="fill:#14181f;font-size:16px;font-weight:700">Gemini drafts</text><text x="945.0" y="200.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">cites a fact per claim</text>
<rect class="bx" x="1110" y="150" width="230" height="70" fill="#fde8e6" stroke="#ea4335"/><text x="1225.0" y="179.5" text-anchor="middle" style="fill:#14181f;font-size:16px;font-weight:700">Fact check</text><text x="1225.0" y="200.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">numbers · names · offers</text>
<rect class="bx" x="1390" y="150" width="170" height="70" fill="#fff" stroke="#9aa4b2"/><text x="1475.0" y="179.5" text-anchor="middle" style="fill:#14181f;font-size:16px;font-weight:700">Risk tier</text><text x="1475.0" y="200.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">low · medium · high</text>
<rect class="bx" x="560" y="290" width="220" height="60" fill="#f1f3f6" stroke="#9aa4b2"/><text x="670.0" y="314.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">No consent or opted out:</text><text x="670.0" y="335.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">dropped, never drafted</text>
<rect class="bx" x="1110" y="290" width="230" height="60" fill="#fde8e6" stroke="#ea4335"/><text x="1225.0" y="314.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">Fails: regenerate once</text><text x="1225.0" y="335.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">with the failure reasons</text>
<rect class="bx" x="1110" y="390" width="230" height="70" fill="#fde8e6" stroke="#ea4335"/><text x="1225.0" y="419.5" text-anchor="middle" style="fill:#14181f;font-size:16px;font-weight:700">Still fails: BLOCKED</text><text x="1225.0" y="440.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">never reaches a customer</text>
<rect class="bx" x="780" y="560" width="260" height="110" fill="#f3e8fd" stroke="#a142f4"/><text x="910.0" y="588.5" text-anchor="middle" style="fill:#14181f;font-size:16px;font-weight:700">OWNER COCKPIT</text><text x="910.0" y="609.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">approve · edit · reject</text><text x="910.0" y="630.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">every claim next to its fact</text><text x="910.0" y="651.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">decisions tune the threshold</text>
<rect class="bx" x="1100" y="560" width="260" height="110" fill="#e6f4ea" stroke="#34a853"/><text x="1230.0" y="588.5" text-anchor="middle" style="fill:#14181f;font-size:16px;font-weight:700">AUTO-SEND</text><text x="1230.0" y="609.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">low risk only</text><text x="1230.0" y="630.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">confidence ≥ learned threshold</text><text x="1230.0" y="651.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">after 20 owner decisions</text>
<rect class="bx" x="900" y="745" width="400" height="70" fill="#fff" stroke="#9aa4b2"/><text x="1100.0" y="774.5" text-anchor="middle" style="fill:#14181f;font-size:16px;font-weight:700">Send: WhatsApp template or Gmail</text><text x="1100.0" y="795.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">opt-out line added by the system</text>
<rect class="bx" x="430" y="560" width="290" height="110" fill="#e0f7fa" stroke="#12b5cb"/><text x="575.0" y="599.0" text-anchor="middle" style="fill:#14181f;font-size:16px;font-weight:700">Order within 30 days</text><text x="575.0" y="620.0" text-anchor="middle" style="fill:#14181f;font-size:16px;">attributed to the message</text><text x="575.0" y="641.0" text-anchor="middle" style="fill:#14181f;font-size:16px;">BigQuery events → Looker Studio</text>
<rect class="bx" x="430" y="745" width="290" height="70" fill="#fff" stroke="#9aa4b2"/><text x="575.0" y="774.5" text-anchor="middle" style="fill:#14181f;font-size:16px;font-weight:700">Customer replies</text><text x="575.0" y="795.5" text-anchor="middle" style="fill:#14181f;font-size:16px;">STOP (any language) → suppressed</text>
<path class="ln" d="M240 185 H290"/><path class="ln" d="M510 185 H560"/><path class="ln" d="M780 185 H830"/><path class="ln" d="M1060 185 H1110"/><path class="ln" d="M1340 185 H1390"/>
<path class="ln" d="M670 220 V290"/><text x="680" y="262" class="lb">no consent</text>
<path class="ln" d="M1225 220 V290"/><text x="1235" y="258" class="lb">hard fail</text>
<path class="ln" d="M1225 350 V390"/><text x="1235" y="376" class="lb">retry fails</text>
<path class="ln" d="M1430 220 V520 H1230 V560"/><text x="1420" y="300" class="lb" text-anchor="end">low risk +</text><text x="1420" y="320" class="lb" text-anchor="end">earned trust</text><path class="ln" d="M1520 220 V470 H910 V560"/><text x="930" y="492" class="lb">medium / high risk, or still in warm-up</text>


<path class="ln" d="M910 670 V745"/><path class="ln" d="M1230 670 V745"/>
<path class="ln" d="M900 780 H720"/><text x="790" y="770" class="lb">delivered</text>
<path class="ln" d="M575 745 V670"/><text x="585" y="712" class="lb">reply / order</text>

</svg>